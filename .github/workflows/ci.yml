name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile-check
        run: python -m compileall -q app.py quiz.py

      - name: Install ruff
        run: pip install ruff

      - name: Lint (must-pass set)
        run: ruff check --select=E9,F63,F7,F82 --output-format=github .

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Wrangler dry-run deploy
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: dry-run-no-auth-needed
